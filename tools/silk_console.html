<!doctype html>
<meta charset="utf-8">
<title>Silk Console</title>
<style>
 body{font:14px/1.45 -apple-system,system-ui,sans-serif;margin:20px;max-width:1000px}
 h2{margin:0 0 4px} .muted{color:#666;font-size:12px}
 button{font:inherit;padding:6px 12px;margin:3px;border:1px solid #bbb;border-radius:7px;background:#fff;cursor:pointer}
 button:hover{background:#f1f1f4}
 textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;margin-top:6px;
   border:1px solid #ccc;border-radius:8px;padding:8px}
 .res{border:1px solid #ddd;border-radius:8px;padding:8px;margin:8px 0;background:#fafafa}
 .res b{font-size:13px} pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px}
 .ok{color:#0a7a2f}.bad{color:#a11}
 #bar{padding:6px;background:#f3f3f6;border-radius:8px;margin:10px 0}
</style>
<h2>Silk Console</h2>
<p class="muted">Drives the agent page loaded in Silk on the Echo Show. The device page never needs editing.</p>

<div id="bar">device: <b id="dev">unknown</b> · results: <b id="cnt">0</b> · <span id="pl">idle</span></div>

<div>
  <button onclick="send('full')">Fingerprint (full)</button>
  <button onclick="send('secure')">Secure-context + ServiceWorker</button>
  <button onclick="send('sw')">ServiceWorker only</button>
  <button onclick="send('download')">Download test</button>
  <button onclick="clearAll()">Clear results</button>
</div>

<textarea id="code" spellcheck="false">// runs on the device; return any JSON-serialisable value
const r = {};
r.version = navigator.userAgent;
r.coi = window.crossOriginIsolated;
r.storage = await navigator.storage.estimate().catch(e=>String(e));
return r;</textarea>
<div><button onclick="runCode()">Run code on device (eval)</button></div>

<div id="results"></div>

<script>
let since = 0, total = 0;

async function send(name){
  const r = await fetch('/enqueue', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name})});
  const t = await r.json();
  document.getElementById('pl').textContent = 'queued ' + name + ' (' + t.id + ')';
}

async function runCode(){
  const code = document.getElementById('code').value;
  const r = await fetch('/enqueue', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:'eval', code})});
  const t = await r.json();
  document.getElementById('pl').textContent = 'queued eval (' + t.id + ')';
}

async function clearAll(){
  await fetch('/clear', {method:'POST'});
  since = 0; total = 0;
  document.getElementById('results').innerHTML = '';
  document.getElementById('cnt').textContent = '0';
}

function render(list){
  const box = document.getElementById('results');
  for(const e of list){
    const d = document.createElement('div');
    d.className = 'res';
    const ok = e.ok !== false;
    d.innerHTML = '<b class="' + (ok?'ok':'bad') + '">' + (e.task||'?') + '</b> ' +
                  '<span class="muted">' + (e.t||'') + ' · ' + (e.client||'') + '</span>' +
                  '<pre></pre>';
    d.querySelector('pre').textContent = JSON.stringify(
      ok ? e.result : (e.error || e.result), null, 2);
    box.prepend(d);
  }
}

async function poll(){
  try{
    const r = await fetch('/results?since=' + since, {cache:'no-store'});
    const j = await r.json();
    if(j.results && j.results.length){
      render(j.results);
      since = j.next;
      total = j.next;
      document.getElementById('cnt').textContent = total;
      document.getElementById('pl').textContent = 'received ' + j.results.length + ' result(s)';
    } else {
      document.getElementById('cnt').textContent = total;
    }
  }catch(e){
    document.getElementById('pl').textContent = 'server unreachable';
  }
  setTimeout(poll, 1200);
}
poll();
</script>
